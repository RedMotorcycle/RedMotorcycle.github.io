<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valor Board (Debug) - Authentication Complete</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --valorant-red: #ff4655;
      --valorant-dark: #0f1923;
      --valorant-white: #ece8e1;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--valorant-dark);
      color: var(--valorant-white);
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      overflow: hidden;
    }

    .container {
      max-width: 400px;
      padding: 40px 20px;
      animation: fadeIn 0.8s ease-out;
    }

    h1 {
      font-weight: 900;
      font-size: min(2.5rem, 10vw);
      text-transform: uppercase;
      margin-bottom: 20px;
      letter-spacing: 2px;
      color: var(--valorant-red);
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    .status-text {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #94a3b8;
    }

    .footer {
      position: absolute;
      bottom: 40px;
      font-size: 0.8rem;
      color: #475569;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Authentication Complete</h1>
    <p class="status-text">Success (Debug Mode)!<br>You can now return to the app.</p>
  </div>

  <div class="footer">
    Valor Board Tracker &copy; RedMotorcycle
  </div>
</body>
</html>
